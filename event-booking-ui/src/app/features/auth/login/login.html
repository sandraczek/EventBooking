<div class="auth-container">
  <div class="auth-card">
    <h2>Logowanie</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>E-mail wydziałowy</label>
        <input type="email" formControlName="email" placeholder="nr_indeksu@student.uczelnia.pl">
      </div>

      <div class="form-group">
        <label>Hasło</label>
        <input type="password" formControlName="password" placeholder="Wpisz hasło">
      </div>

      <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">Zaloguj się</button>
    </form>

    <p class="switch-mode">Nie masz konta? <a routerLink="/register">Zarejestruj się</a></p>
  </div>
</div>
