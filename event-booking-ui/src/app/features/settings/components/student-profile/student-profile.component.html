<section class="student-profile-section">
  <h2>Ustawienia Akademickie</h2>

  <article class="settings-card">
    <h3>Weryfikacja statusu</h3>
    <p>Potwierdź adres e-mail, aby uzyskać dostęp do zniżek.</p>

    <button
      (click)="sendVerificationEmail()"
      [disabled]="isEmailSending()"
      class="btn-primary">
      @if (isEmailSending()) {
        Wysyłanie linku...
      } @else {
        Wyślij link weryfikacyjny
      }
    </button>

    @if (emailMessage()) {
      <p class="status-message" [class.error]="isError()">{{ emailMessage() }}</p>
    }
  </article>

  <article class="settings-card mt-4">
    <h3>Numer indeksu</h3>
    <p class="hint">W przyszłości będziesz mógł tutaj zaktualizować swój numer indeksu.</p>

    <form [formGroup]="studentForm">
      <div class="form-group">
        <label for="indexNumber">Twój Indeks</label>
        <input
          id="indexNumber"
          type="text"
          formControlName="indexNumber"
          placeholder="Brak (oczekuje na API)"
        />
      </div>
      <button type="submit" [disabled]="true" class="btn-secondary">
        Zapisz indeks (Zablokowane)
      </button>
    </form>
  </article>
</section>
